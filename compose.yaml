# The IngeTrazo web viewer and MCP gateway, with their engines.
#
#   docker compose up -d                       # MCP gateway only
#   docker compose --profile viewer up -d      # + the live web viewer
#
# Two images:
#   ingetrazo-web-viewer (this repo)  mcp (the MCP gateway) and viewer:
#       users, OAuth, folder rights, pages; no IngeTrazo
#   ingetrazo (BastelBaus/ingetrazo-docker)  mcp-engine and viewer-engine:
#       IngeTrazo headless, on an internal network only
# Each engine makes its secret on first start in a volume it shares with
# its service (or set MCP_ENGINE_TOKEN / ENGINE_TOKEN).
#
# Settings come from .env (copy .env.example). Models live in ./data
# (or INGETRAZO_DATA_DIR); every service sees the same folder.
# Several model folders, each read-only or read/write: MODEL_FOLDERS in
# .env and their bind mounts in compose.override.yaml (see
# compose.folders.example.yaml and the README).

x-engine: &engine
  image: ${INGETRAZO_IMAGE:-ghcr.io/bastelbaus/ingetrazo:latest}
  restart: unless-stopped
  init: false            # tini is the image's entrypoint already
  shm_size: 256m
  command: ["engine"]
  networks: [engine]

x-web: &web
  image: ${WEB_VIEWER_IMAGE:-ghcr.io/bastelbaus/ingetrazo-web-viewer:latest}
  build:
    context: .
    args:
      WEB_VIEWER_REF: ${WEB_VIEWER_REF:-dev}
  restart: unless-stopped
  init: false
  networks: [default, engine]

services:
  # The MCP gateway: what AI clients reach. Checks tokens / OAuth and each
  # user's folders, then forwards to mcp-engine.
  mcp:
    <<: *web
    command: ["mcp"]
    depends_on:
      - mcp-engine
    ports:
      - "${MCP_BIND:-127.0.0.1}:${MCP_PORT:-8765}:8765"
    environment:
      HEALTH_PORT: "8765"
      MCP_AUTH: ${MCP_AUTH:-token}
      MCP_TOKEN: ${MCP_TOKEN:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      OAUTH_USER: ${OAUTH_USER:-admin}
      OAUTH_PASSWORD: ${OAUTH_PASSWORD:-}
      OAUTH_REDIRECT_URIS: ${OAUTH_REDIRECT_URIS:-}
      OAUTH_ACCESS_TOKEN_SECONDS: ${OAUTH_ACCESS_TOKEN_SECONDS:-}
      OAUTH_REFRESH_TOKEN_DAYS: ${OAUTH_REFRESH_TOKEN_DAYS:-}
      MODEL_FOLDERS: ${MODEL_FOLDERS:-}
      MODEL_SCAN_DEPTH: ${MODEL_SCAN_DEPTH:-}
      MODEL_EXCLUDE: ${MODEL_EXCLUDE:-}
      INGETRAZO_AI_TIMEOUT: ${INGETRAZO_AI_TIMEOUT:-}
      MCP_ENGINE_URL: http://mcp-engine:8766
      ENGINE_TOKEN: ${MCP_ENGINE_TOKEN:-}
      ENGINE_TOKEN_FILE: /engine/token
      USERS_DB: /users/users.db
      # The key to show tokens again; unset: /users/token.key (made on the first start).
      TOKEN_KEY: ${TOKEN_KEY:-}
      DEFAULT_SHARES: ${DEFAULT_SHARES:-*:r}
    volumes:
      # Read-only here: the gateway only checks paths; mcp-engine writes.
      - ${INGETRAZO_DATA_DIR:-./data}:/data:ro
      - mcp-state:/state
      - users:/users
      - mcp-engine-secret:/engine:ro

  # IngeTrazo for the MCP gateway: every tool but shutdown, paths inside
  # /data. Only on the internal network, no port.
  mcp-engine:
    <<: *engine
    environment:
      ENGINE_MODE: mcp
      HEALTH_PORT: "8766"
      ENGINE_TOKEN: ${MCP_ENGINE_TOKEN:-}
      ENGINE_TOKEN_FILE: /engine/token
      INGETRAZO_MODEL: ${INGETRAZO_MODEL:-}
      MODEL_FOLDERS: ${MODEL_FOLDERS:-}
      MODEL_SCAN_DEPTH: ${MODEL_SCAN_DEPTH:-}
      MODEL_EXCLUDE: ${MODEL_EXCLUDE:-}
      INGETRAZO_ALLOW_SAVE: ${INGETRAZO_ALLOW_SAVE:-true}
      INGETRAZO_SAVE_FORMAT: ${INGETRAZO_SAVE_FORMAT:-}
      INGETRAZO_AI_TIMEOUT: ${INGETRAZO_AI_TIMEOUT:-}
      HEALTH_MAX_BUSY_SECONDS: ${HEALTH_MAX_BUSY_SECONDS:-}
      XVFB_SCREEN: ${XVFB_SCREEN:-}
    volumes:
      - ${INGETRAZO_DATA_DIR:-./data}:/data
      - mcp-engine-state:/state
      - mcp-engine-secret:/engine

  viewer:
    <<: *web
    profiles: ["viewer"]
    command: ["viewer"]
    depends_on:
      - viewer-engine
    ports:
      - "${VIEWER_BIND:-127.0.0.1}:${VIEWER_PORT:-8080}:8080"
    environment:
      HEALTH_PORT: "8080"
      VIEWER_AUTH_MODE: ${VIEWER_AUTH_MODE:-local}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # The old names, still read when ADMIN_USER / ADMIN_PASSWORD are not set:
      VIEWER_USER: ${VIEWER_USER:-}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:-}
      VIEWER_GUEST: ${VIEWER_GUEST:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-}
      OIDC_USERNAME_CLAIM: ${OIDC_USERNAME_CLAIM:-}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-}
      OIDC_ALLOW_HTTP: ${OIDC_ALLOW_HTTP:-}
      PROXY_TRUSTED_IPS: ${PROXY_TRUSTED_IPS:-}
      PROXY_USER_HEADER: ${PROXY_USER_HEADER:-}
      PROXY_GROUPS_HEADER: ${PROXY_GROUPS_HEADER:-}
      PROXY_ADMIN_GROUP: ${PROXY_ADMIN_GROUP:-}
      PROXY_LOGOUT_URL: ${PROXY_LOGOUT_URL:-}
      MODEL_FOLDERS: ${MODEL_FOLDERS:-}
      MODEL_SCAN_DEPTH: ${MODEL_SCAN_DEPTH:-}
      MODEL_EXCLUDE: ${MODEL_EXCLUDE:-}
      VIEWER_TITLE: ${VIEWER_TITLE:-IngeTrazo-docker}
      VIEWER_PRERENDER: ${VIEWER_PRERENDER:-previews}
      VIEWER_SHEET_DPI: ${VIEWER_SHEET_DPI:-120}
      VIEWER_NAV_MODE: ${VIEWER_NAV_MODE:-tree}
      VIEWER_GLB_MAX_MB: ${VIEWER_GLB_MAX_MB:-50}
      VIEWER_AUDIT: ${VIEWER_AUDIT:-true}
      VIEWER_AUDIT_MAX_MB: ${VIEWER_AUDIT_MAX_MB:-10}
      VIEWER_AUDIT_KEEP: ${VIEWER_AUDIT_KEEP:-5}
      VIEWER_AUDIT_DAYS: ${VIEWER_AUDIT_DAYS:-90}
      VIEWER_TRUSTED_PROXIES: ${VIEWER_TRUSTED_PROXIES:-}
      INGETRAZO_AI_TIMEOUT: ${INGETRAZO_AI_TIMEOUT:-}
      # The render engine(s); several: one URL per engine service.
      ENGINE_URLS: ${ENGINE_URLS:-http://viewer-engine:8766}
      ENGINE_TOKEN: ${VIEWER_ENGINE_TOKEN:-${ENGINE_TOKEN:-}}
      ENGINE_TOKEN_FILE: /engine/token
      USERS_DB: /users/users.db
      # The key to show tokens again; unset: /users/token.key (made on the first start).
      TOKEN_KEY: ${TOKEN_KEY:-}
      DEFAULT_SHARES: ${DEFAULT_SHARES:-*:r}
    volumes:
      - ${INGETRAZO_DATA_DIR:-./data}:/data:ro
      - viewer-cache:/cache
      - viewer-state:/state
      - users:/users
      - engine-secret:/engine:ro

  # IngeTrazo for the viewer: renders into the cache both mount at /cache.
  # Only on the internal network, no port; never saves a model.
  viewer-engine:
    <<: *engine
    profiles: ["viewer"]
    environment:
      HEALTH_PORT: "8766"
      ENGINE_TOKEN: ${VIEWER_ENGINE_TOKEN:-${ENGINE_TOKEN:-}}
      ENGINE_TOKEN_FILE: /engine/token
      MODEL_FOLDERS: ${MODEL_FOLDERS:-}
      MODEL_SCAN_DEPTH: ${MODEL_SCAN_DEPTH:-}
      MODEL_EXCLUDE: ${MODEL_EXCLUDE:-}
      INGETRAZO_AI_TIMEOUT: ${INGETRAZO_AI_TIMEOUT:-}
      HEALTH_MAX_BUSY_SECONDS: ${HEALTH_MAX_BUSY_SECONDS:-}
      XVFB_SCREEN: ${XVFB_SCREEN:-}
    volumes:
      - ${INGETRAZO_DATA_DIR:-./data}:/data:ro
      - viewer-cache:/cache
      - engine-state:/state
      - engine-secret:/engine

# IPv4 only, both networks: some Docker hosts (TrueNAS) create networks with
# IPv6 and report the gateway with its prefix ("fd..::1/64"), which docker
# compose then fails to parse on the next `up` or `down` of the network.
networks:
  default:
    enable_ipv6: false
  engine:
    internal: true       # the services <-> their engines only, no way out
    enable_ipv6: false

volumes:
  mcp-state:
  viewer-cache:
  viewer-state:
  engine-state:
  engine-secret:         # the viewer engine's secret, made on its first start
  mcp-engine-state:
  mcp-engine-secret:     # the MCP engine's secret, made on its first start
  users:                 # the user list (users.db), shared by both services
