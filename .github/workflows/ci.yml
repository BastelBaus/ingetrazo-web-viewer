# Unit tests, build the image and run the end-to-end smoke test: the MCP
# gateway and the viewer in every login mode, each with its engine (the
# ingetrazo-docker image, ENGINE_IMAGE: the repo variable, or :dev).
name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:          # publish.yml runs it before publishing

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ENGINE_IMAGE: ${{ vars.ENGINE_IMAGE || 'ghcr.io/bastelbaus/ingetrazo:dev' }}
    steps:
      - uses: actions/checkout@v7

      - name: Lint shell scripts
        run: shellcheck entrypoint.sh tests/smoke.sh tests/full.sh

      - name: Unit tests (users, rights, folders, render queue, pages, engine client, OAuth, logins, security)
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - uses: docker/setup-buildx-action@v4

      - name: Build image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ingetrazo-web-viewer:ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      - name: Pull the engine image
        run: |
          docker pull "$ENGINE_IMAGE"
          echo "### Engine: \`$ENGINE_IMAGE\` ($(docker run --rm --entrypoint cat "$ENGINE_IMAGE" /opt/ingetrazo/BUILD_REF))" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        env:
          IMAGE: ingetrazo-web-viewer:ci
        run: tests/smoke.sh

      - name: Validate compose file
        env:
          MCP_TOKEN: ci-dummy-token-0123456789
        run: |
          docker compose --profile viewer config -q
          docker compose -f compose.yaml -f compose.folders.example.yaml --profile viewer config -q
